
<h2 mat-dialog-title>add Machine to user</h2>
    <mat-dialog-content>
      <mat-form-field appearance="fill">
        <mat-label> Machines</mat-label>
        <mat-select [(value)]="selectedMachine" >
        <mat-option *ngFor="let machine of MachinesPerBranch" [value]="machine.ip">
          {{ machine.name }}
        </mat-option>
      </mat-select>
      </mat-form-field>

    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Close</button>
      <button mat-button (click)="submit()" [disabled]="!selectedMachine">Submit</button>
    </mat-dialog-actions>
