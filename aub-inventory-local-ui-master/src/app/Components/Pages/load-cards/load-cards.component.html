<app-navbar></app-navbar>
<div *ngIf="loaderService.isLoading | async"  class="loader-container">
    <mat-spinner mode="indeterminate" style="top:50%;left: 50%;"></mat-spinner>
</div>
<section class="hero row m-0 justify-content-around">
    <div class="text-center mt-3">
        <h1 class="text-center " style="color: #36454F;">Load Cards</h1>
        <div  class="text-center d-flex justify-content-center " style="width: 100%;" >
            <div style="background-color: #0f85d3; height: 1px; width: 80px;"></div>
        </div>
      </div>
    <div class="hero-container col-md-6 mt-3">
        <div class="d-flex justify-content-center align-items-center mb-4">
            <img src="../../../../assets/Imgs/uploadArrow.png" alt="upload" style="height: 30px;">
            <h2 class="text-center ms-3 me-3">Upload File</h2>
            <img src="../../../../assets/Imgs/uploadArrow.png" alt="upload" style="height: 30px;">
        </div>
        <div class="d-flex">
            <label for="input-file" id="drop-area">
                <input type="file" id="input-file" accept=".dat" hidden (change)="onFileSelected($event)">
                <div id="icon-view">
                    <img src="../../../../assets/Imgs/Icons/upload.png" alt="upload" class="img-fluid">
                    <p class="mt-3 mb-1 text-secondary">Drag and drop encrypted file or click here.</p>
                    <span class="text-secondary">supported file type: <b>dat</b></span>
                </div>
            </label>
        </div>
    </div>
    <div class="col-md-4 mt-3">
        <img src="../../../../assets/Imgs/Upload.svg" alt="">
    </div>
</section>
