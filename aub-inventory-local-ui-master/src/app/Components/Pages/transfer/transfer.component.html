<app-navbar></app-navbar>
<div *ngIf="loaderService.isLoading | async"  class="loader-container">
  <mat-spinner mode="indeterminate" style="top:50%;left: 50%;"></mat-spinner>
</div>


<section class="main-bg pt-4">
  <div class="text-center mb-4">
    <h2 class="text-center " style="color: #36454F;">Transfer Cards</h2>
    <div  class="text-center d-flex justify-content-center " style="width: 100%;" >
        <div style="background-color: #0f85d3; height: 1px; width: 80px;"></div>
    </div>
  </div>
  <!-- <div class="title d-flex justify-content-center align-items-center">
    <h2 class="text-center mb-4" style="border-bottom: 3px solid rgb(0, 140, 255);">Transfer Cards
    </h2>
  </div> -->
  <div class="col-md-3">
  </div>
  <div class="row m-0 justify-content-around">

    <div class="col-md-6 bg-white p-4 branches-stock-container">
      <div class="d-flex justify-content-center mb-3">
        <img src="../../../../assets/Imgs/stock.png" alt="stock" style="height: 40px;" class="me-3">
        <h4 class="text-center" style="border-bottom:solid 3px #0f85d3">Branches Stock</h4>
        <img src="../../../../assets/Imgs/stock.png" alt="stock" style="height: 40px;" class="ms-3">
      </div>
      <div class="table-list">
        <div class="align-items-center m-0 branch-stock" *ngFor="let branch of branchesStock">
          <div class="d-flex align-items-center mb-1 mt-1">
            <h6 class="p-0 m-0">{{branch.branchName}}</h6>
          </div>
          <div class="d-flex ms-4 mb-1">
            <ng-container *ngFor="let proudct of branch.productsWithAmount">
              <div class="product-card">
                {{proudct.productName}} : {{proudct.cardAmount}}
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4 bg-white p-3 transfer" style="border-radius: 10px;">
      <div class="title d-flex justify-content-center align-items-center mb-3">
        <img src="../../../../assets/Imgs/transfer3.png" alt="" height="30px" class="me-3">
        <h4 class="text-center" style="border-bottom: 3px solid #0f85d3;">Transfer</h4>
        <img src="../../../../assets/Imgs/transfer3.png" alt="" height="30px" class="ms-3">
      </div>
      <form [formGroup]="form" (submit)="transferCards()">
        <div class="mb-3">
          <div class="title d-flex mb-1">
            <img src="../../../../assets/Imgs/creditCard.png" alt="credit-card" class="me-2" style="height:25px;">
            <label class="mb-1" style="font-weight: 500;">Product</label>
          </div>
          <select class="form-select" aria-label="Default select example" formControlName="productId">
            <option [value]="product.id" *ngFor="let product of productsVM">{{product.productName}}</option>
          </select>
        </div>
        <div class="mb-3">
          <div class="title d-flex mb-1">
            <img src="../../../../assets/Imgs/building2.png" alt="credit-card" class="me-2" style="height:25px;">
            <label style="font-weight: 500;" class="mb-1">Source branch</label>
          </div>
          <select (change)="checkEqaulitySource($event)" class="form-select" aria-label="Default select example" formControlName="sourceStock">
            <option [value]="product.branchName" *ngFor="let product of branchesVM">{{product.branchName}}</option>
          </select>
        </div>
        <div class="mb-3">
          <div class="title d-flex mb-1">
            <img src="../../../../assets/Imgs/building2.png" alt="credit-card" class="me-2" style="height:25px;">
            <label style="font-weight: 500;" class="mb-1">Target branch</label>
          </div>
          <select (change)="checkEqaulityTarget($event)" class="form-select" aria-label="Default select example" formControlName="targetStock">
            <option [value]="product.branchName" *ngFor="let product of branchesVM">{{product.branchName}}</option>
          </select>
        </div>
        <div class="mb-3">
          <div class="title d-flex mb-1">
            <img src="../../../../assets/Imgs/cardamount.png" alt="credit-card" class="me-2" style="height:30px;">
            <label style="font-weight: 500;" for="exampleFormControlInput1" class="form-label">
              Card Amount
            </label>
          </div>
          <input type="number" class="form-control" formControlName="cardAmount" min="0">
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn transferBtn" style="width:120px;color:white;">
            Transfer
          </button>
        </div>
      </form>
    </div>
  </div>


</section>
