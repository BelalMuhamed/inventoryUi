<div>

<div class="d-flex mt-5 justify-content-around align-items-start">
        <div class="me-5">
            <label class="mb-2" style="color: #0f85d3;">Search By Branch</label>
            <select class="form-select" [(ngModel)]="selectedBranch" [disabled]="!isCCAdmin">
                <option value="" selected disabled>Select Branch</option>
                <ng-container *ngIf="isCCAdmin">
                    <option value="All">All</option>
                    <option *ngFor="let branch of branches">{{branch.branchName}}</option>
                </ng-container>
                <ng-container *ngIf="!isCCAdmin">
                    <option >{{selectedBranch}}</option>
                </ng-container>
            </select>
            <label class="my-2" style="color: #0f85d3;">Search By PAN</label>
                <input type="number" onKeyPress="if(this.value.length==6) return false;" class="form-control"
                    placeholder="Enter Last 6 Digits PAN..." [(ngModel)]="pan"
                >
        </div>
        <div>
            <label class="mb-2"style="color: #0f85d3;">Status</label>
            <div class="form-check">
                <div >
                    <input (change)="onCheckBoxChange('0')" class="form-check-input" type="checkbox" [value]="0" name="flexCheckDefault" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">Uploaded</label>
                </div>
                <div>
                    <input (change)="onCheckBoxChange('1')" class="form-check-input" type="checkbox" [value]="1" name="flexCheckDefault" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">Success</label>
                </div>
                <div>
                    <input (change)="onCheckBoxChange('2')" class="form-check-input" type="checkbox" [value]="2" name="flexCheckDefault" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">Damage</label>
                </div>
                <div>
                    <input (change)="onCheckBoxChange('3')" class="form-check-input" type="checkbox" [value]="2" name="flexCheckDefault" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">Error</label>
                </div>
            </div>
        </div>
        <div>
            <mat-form-field>
                <mat-label >Enter a date range</mat-label>
                <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                    <input matStartDate formControlName="start" placeholder="Start date">
                    <input matEndDate formControlName="end" placeholder="End date">
                </mat-date-range-input>
                <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-date-range-picker #picker></mat-date-range-picker>
            </mat-form-field>
            <!-- <p>Selected range: {{range.value | json}}</p> -->

        </div>
    </div>
    <div class="d-flex justify-content-center mt-4">
        <button class="btn btn-dark" (click)="searchCards()" [disabled]="!validSearch()">
            <div class="d-flex align-items-center">
                <img src="../..//../../../assets/Imgs/search2.png" class="me-1" width="20px" height="20px" style="color: white;">
                <span>Search</span>
            </div>
        </button>
    </div>
    <div class="text-end mt-5">
        <button class="btn btn-success" (click)="exportCardsToExcel()">
            <div class="d-flex align-items-center ">
                <img src="../../../../../assets/Imgs/download.png" class="me-1" alt="" width="20px" height="20px">
                <span>Export To Excel</span>
            </div>
        </button>
    </div>
    <table class="table mt-2">
        <thead>
            <tr class="text-center">
                <th>#</th>
                <th>Card Type</th>
                <th>Card #</th>
                <th>Branch</th>
                <!-- <th>Batch</th> -->
                <th>Status</th>
                <th>Message</th>
                <th>Date</th>
                <th>Time</th>
                <th>User</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let card of cards let i = index " class="text-center">
                <td>{{i+1}}</td>
                <td>{{card.productName}}</td>
                <td>{{card.maskedPan}}</td>
                <td>{{card.branchName}}</td>
                <!-- <td>{{card.batchName}}</td> -->
                <td>
                    <div [ngSwitch]="card.status">
                        <div *ngSwitchCase="0">Uploaded</div>
                        <div *ngSwitchCase="1">Success</div>
                        <div *ngSwitchCase="2">Damage</div>
                        <div *ngSwitchCase="3">Error</div>
                        <div *ngSwitchDefault></div>
                    </div>
                </td>
                <td>{{card.message}}</td>
                <td>{{card?.date|date:'MMM d, y'}}</td>
                <td>{{card?.date|date:'h:mm a'}}</td>
                <td>{{card.username}}</td>
            </tr>


        </tbody>
    </table>
    <mat-paginator #paginator [length]="totalCards" [pageSize]="pageSize" [pageIndex]="pageIndex"
         (page)="pageEvent = PaginatorEvent($event)"
        aria-label="Select page">
    </mat-paginator>

</div>
