<app-navbar></app-navbar>

<h3 class="text-center mt-3">
    <img src="../../../../assets/Imgs/branch stock.png" alt="" height="50px">
    Stock for
    <span class="text-warning">
        {{currentBranch}}
    </span>
</h3>
<div class="text-end me-4">
    <a routerLink="/Export">Do you need to export?</a>
</div>
<div>

</div>
<div class="container d-flex justify-content-around">


<div style="background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); width:50%">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div>


    </div>

  </div>

  <div style="margin-top: 20px;">
    <canvas baseChart
            [data]="{ labels: barChartLabels, datasets: barChartData }"
            [type]="barChartType"
            [options]="barChartOptions">
    </canvas>
  </div>
</div>

<div class="w-25 mt-5">
  <canvas
    baseChart
    [data]="{ labels: pieChartLabels, datasets: [{ data: pieChartData }] }"
    [type]="pieChartType"
    [options]="chartOptions">
  </canvas>
</div>
</div>
<div *ngIf="dataSource?.data?.length === 0 || isEmpty" class="text-center">
    <img src="../../../../assets/Imgs/No data.svg" alt="No data available" style="width: 600px; height: auto;" />
</div>

<div class="p-3 d-flex justify-content-center container" *ngIf="dataSource?.data?.length > 0" style="min-height: 500px;">
    <div class="card container-fluid p-0">
        <table matSort mat-table [dataSource]="dataSource" class="table-desponsive table-none-scroll" >

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <ng-container matColumnDef="Product">
                <th mat-header-cell *matHeaderCellDef>
                    Product
                </th>
                <td mat-cell *matCellDef="let element">
                    {{element.productName}} </td>
            </ng-container>

            <ng-container matColumnDef="Avaliable amount">
                <th mat-header-cell *matHeaderCellDef> Avaliable Amount
                </th>
                <td mat-cell *matCellDef="let element">
                    <span class="text-success">
                        {{element.cardAmount}}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="Hold amount">
                <th mat-header-cell *matHeaderCellDef>
                        On hold
                </th>
                <td mat-cell *matCellDef="let element">
                    <span class="text-danger">
                        {{element.holdAmount}}
                    </span>
                </td>
            </ng-container>

        </table>

    </div>
</div>
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of user elements"class="container ">
</mat-paginator>
