<app-navbar></app-navbar>
<div *ngIf="loaderService.isLoading | async"  class="loader-container">
    <mat-spinner mode="indeterminate" style="top:50%;left: 50%;"></mat-spinner>
</div>
<section class="configration">

        <div class="text-center mb-3">
            <h1 class="text-center mt-3 "  style="color: #36454F;">Configuration</h1>
            <div  class="text-center d-flex justify-content-center" style="width: 100%;" >
                <div style="background-color: #0f85d3; height: 1px; width: 80px;"></div>
            </div>
        </div>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 95.4px - 82.4px - 20px);">
        <div class="d-flex flex-row flex-nowrap justify-content-center align-items-stretch overflow-auto w-100 gap-4">

            <div class="card me-2 p-3" style="width: 18rem;" routerLink="/Branch">
                <img src="../../../../assets/Imgs/Building-amicoo.svg" class="card-img-top" alt="Branch">
                <div class="card-body">
                  <h4 class="card-text text-center">Branch</h4>
                </div>
              </div>



              <div class="card me-2 p-3" style="width: 18rem;" routerLink="/ManageUsers">
                <img src="../../../../assets/Imgs/User research-bro.svg" class="card-img-top" alt="User">
                <div class="card-body">
                  <h4 class="card-text text-center">Users</h4>
                </div>
              </div>

              <div class="card me-2 p-3" style="width: 18rem;" routerLink="/Products">
                <img src="../../../../assets/Imgs/Product iteration-rafiki.svg" class="card-img-top" >
                <div class="card-body">
                  <h4 class="card-text text-center">Product Quantity</h4>
                </div>
              </div>

                <div class="card ms-2 p-3  d-flex flex-column justify-content-between  " style="width: 18rem;" routerLink="/machine-config-menu" >
                <div>
                <img src="../../../../assets/Imgs/MachineConfigImage.png" class="card-img-top mt-3" >
                </div>
                <div class=" pb-3">
                  <h4 class="card-text text-center p-0">Machines Configurations </h4>
                </div>
              </div>
        </div>
    </div>

</section>
