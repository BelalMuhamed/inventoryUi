

<app-navbar></app-navbar>

<div class="container mt-4 minHeight">

    <!-- select Product select box  -->
    <div>
   <label class="mb-3 text-info">Select Product</label>
                <label style="color: red;" class="ms-1">*</label>
                <select class="form-select mb-3"(change)="onProductChange($event)"  >
                    <option value="" disabled selected>Please Select Product</option>
                    <option [value]="product.id" *ngFor="let product of products" >{{product.productName}}</option>
                </select>
    </div>
    <div *ngIf="this.selectedProduct!=null">
      <!-- add button -->
        <div class=" d-flex justify-content-end  ">
          <a (click)="openDialog()" class=" text-decoration-none add-button"*ngIf="printConfigForSelectedProduct.length < 2">
              <i class="fa fa-plus"></i> Add Product Configuration
          </a>

        </div>
        <table mat-table [dataSource]="printConfigForSelectedProduct" class="mat-elevation-z8 my-4">

  <!-- Printed Column -->
  <ng-container matColumnDef="printedFace">
    <th mat-header-cell *matHeaderCellDef> Printed Face </th>
    <td mat-cell *matCellDef="let element"> {{ element.printedFace === 0 ? 'Front Face' : 'Back Face' }} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="font">
    <th mat-header-cell *matHeaderCellDef> Font </th>
    <td mat-cell *matCellDef="let element"> {{element.font}} </td>
  </ng-container>

  <!-- Email Column -->
  <ng-container matColumnDef="cpi">
    <th mat-header-cell *matHeaderCellDef> CPI </th>
    <td mat-cell *matCellDef="let element"> {{element.cpi}} </td>
  </ng-container>
 <ng-container matColumnDef="offSetX">
    <th mat-header-cell *matHeaderCellDef> Offset X </th>
    <td mat-cell *matCellDef="let element"> {{element.offSetX}} </td>
  </ng-container>
   <ng-container matColumnDef="offSetY">
    <th mat-header-cell *matHeaderCellDef> Offset Y </th>
    <td mat-cell *matCellDef="let element"> {{element.offSetY}} </td>
  </ng-container>
   <ng-container matColumnDef="image" >
    <th mat-header-cell *matHeaderCellDef> Image </th>
    <td mat-cell *matCellDef="let element">
        <img [src]="'data:image/jpeg;base64,' + element.image" class="w-75 p-4" />
    </td>

  </ng-container>
    <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let element">
    <ul class="d-flex justify-content-start px-0   align-items-center " style="list-style: none;">


                          <li class="m-2 cursor-pointer"
                               title="Edit"(click)="OpenEditDialog(element)">

                                  <i class="fa-regular fa-pen-to-square text-primary " ></i>


                          </li>
                           <li class="m-2 " style="color: red;" (click)="DeletePrintConfig(element)"><i class="fa-solid fa-trash  cursor-pointer"></i></li>
                        </ul>

    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

    </div>
</div>
