


 <app-navbar></app-navbar>



    <div class="table-header">
      <div class="search-container">

         <input type="text" placeholder="Search by User name or machine name " class="form-control"
       (keyup)="applyFilter($event)">
      </div>
      <div class="header-buttons">


       <a routerLink="/add-machine-to-user" class="add-button text-decoration-none">
    <i class="fa fa-plus"></i> Assign Machine To user
</a>

      </div>
    </div>
    <div class="d-flex justify-content-center align-items-center container">
    <div style="width: 100%;">
        <h2 style="color: #36454F;" class="text-center mt-3 mb-2">User With Machines  </h2>
        <div class="justify-content-center d-flex mb-3">
    <div style="height: 1px;width: 100px;background-color: #2e688e;"></div>
</div>


          <div class="p-3 d-flex justify-content-center" >
    <div class="card container-fluid p-0">
        <table matSort mat-table [dataSource]="dataSource " class="table-desponsive table-none-scroll">
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <ng-container matColumnDef="userName">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;">
                    User Name
                </th>
                <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
            </ng-container>

            <ng-container matColumnDef="machineIp">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Machine Ip </th>
                <td mat-cell *matCellDef="let element"> {{element.machineIp}} </td>
            </ng-container>


              <ng-container matColumnDef="machineName">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Machine Name </th>
                <td mat-cell *matCellDef="let element"> {{element.machineName}} </td>
            </ng-container>


            <ng-container matColumnDef="BranchName">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Branch Name </th>
                <td mat-cell *matCellDef="let element"> {{element.branchName}} </td>
            </ng-container>


            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Actions </th>
                <td mat-cell *matCellDef="let element">
                 <ul class="d-flex justify-content-center   align-items-center " style="list-style: none;">


                          <li class="m-2">
                               <a (click)="openPopup(element.branchName,element.userName)" >
                                  <i class="fa-regular fa-pen-to-square text-success"></i>
                              </a>

                          </li>
                           <li class="m-2 "(click)="Delete(element.userName)"><i  class="fa-solid fa-trash text-danger cursor-pointer"></i></li>
                        </ul>
                </td>
            </ng-container>




        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of user elements">
        </mat-paginator>
    </div>
          </div>

      </div>
    </div>
