
<mat-dialog-content>
<form [formGroup]="AddConfigForm" (submit)="onSave()">
 <div class="row mb-3">
     <div class="col-md-6">
        <label for="model" class="form-label" style="color: #0f85d3;">Font</label>
            <label style="color: red;">*</label>
        <input
          type="text"
          class="form-control"
          id="model"
          formControlName="font"
          autocomplete="font"
          [ngClass]="{
            'is-invalid':
              AddConfigForm.get('font')?.invalid &&
              AddConfigForm.get('font')?.touched
          }"
        />

        <div *ngIf="AddConfigForm.get('font')?.invalid &&AddConfigForm.get('font')?.touched" class="invalid-feedback">Font is required</div>

      </div>

        <div class="col-md-6">
        <label for="sn" class="form-label" style="color: #0f85d3;">CPI</label>
            <label style="color: red;">*</label>
        <input
          type="text"
          class="form-control"
          id="sn"
          formControlName="cpi"
          autocomplete="cpi"
          [ngClass]="{
            'is-invalid':
              AddConfigForm.get('cpi')?.invalid &&
              AddConfigForm.get('cpi')?.touched
          }"
        />

        <div *ngIf="AddConfigForm.get('cpi')?.invalid &&AddConfigForm.get('cpi')?.touched" class="invalid-feedback">CPI is required</div>

      </div>


</div>
<div class="row mb-3">
     <div class="col-md-6">
        <label for="model" class="form-label" style="color: #0f85d3;">Offset X</label>
            <label style="color: red;">*</label>
        <input
          type="text"
          class="form-control"
          id="model"
          formControlName="offSetX"
          autocomplete="offSetX"
          [ngClass]="{
            'is-invalid':
              AddConfigForm.get('offSetX')?.invalid &&
              AddConfigForm.get('offSetX')?.touched
          }"
        />

        <div *ngIf="AddConfigForm.get('offSetX')?.invalid &&AddConfigForm.get('offSetX')?.touched" class="invalid-feedback">Offset X is required</div>

      </div>

        <div class="col-md-6">
        <label for="sn" class="form-label" style="color: #0f85d3;">Offset Y</label>
            <label style="color: red;">*</label>
        <input
          type="text"
          class="form-control"
          id="sn"
          formControlName="offSetY"
          autocomplete="offSetY"
          [ngClass]="{
            'is-invalid':
              AddConfigForm.get('offSetY')?.invalid &&
              AddConfigForm.get('offSetY')?.touched
          }"
        />

        <div *ngIf="AddConfigForm.get('offSetY')?.invalid &&AddConfigForm.get('offSetY')?.touched" class="invalid-feedback">OffSet Y is required</div>

      </div>


    </div>
<div class="row mb-3">
   <div class="col-md-8 " >
      <label for="feederId" class="form-label" style="color: #0f85d3;">
        Printed Face  <span style="color: red;">*</span>
      </label>
        <div class="d-flex justify-content-start align-items-center">

      <div class="form-check">
        <input class="form-check-input" type="radio" formControlName="printedFace" [value]=0 id="feederId0" />
        <label class="form-check-label text-black" for="feederId0">Front Face</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" formControlName="printedFace" [value]=1 id="feederId1" />
        <label class="form-check-label text-black" for="feederId1">Back Face</label>
      </div>
        </div>

      <div *ngIf="AddConfigForm.get('printedFace')?.invalid && AddConfigForm.get('printedFace')?.touched" class="invalid-feedback d-block">
        Printed Face  is required!
      </div>
      </div>
      <div class="col-md-4">
  <label for="image" class="form-label" style="color: #0f85d3;">Upload Image <span style="color:red">*</span></label>
  <input
    type="file"
    id="image"
    accept="image/*"
    (change)="onFileSelected($event)"
    class="form-control" />

  <div *ngIf="AddConfigForm.get('image')?.invalid && AddConfigForm.get('image')?.touched" class="invalid-feedback d-block">
    Image is required!
  </div>
</div>

</div>
</form>

</mat-dialog-content>


<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()">Save</button>
</mat-dialog-actions>
