<app-navbar></app-navbar>

<div *ngIf="loaderService.isLoading | async"  class="loader-container">
    <mat-spinner mode="indeterminate" style="top:50%;left: 50%;"></mat-spinner>
</div>
<section class="main-bg pt-4">
    <h2 style="color: #36454F;" class="text-center mb-2">Card Center Distribution</h2>
    <div class="justify-content-center d-flex mb-3">
        <div style="height: 1px;width: 100px;background-color: #0f85d3;"></div>
    </div>
    <div class="d-flex justify-content-center cc-stock container">
        <h6 class="me-3" style="border-bottom: 2px solid rgb(0, 140, 255);">Card Center Stock</h6>
        <ng-container *ngFor="let product of cardCenterStock?.productsWithAmount">
            <span class="me-2 ps-2" style="border-left: 3px solid rgb(0, 140, 255);border-radius: 10px;">{{product.productName}}</span>
            <span class="me-4">{{product.cardAmount}}</span>
        </ng-container>
    </div>

    <div class="container mt-4">
        <div class="row m-0 justify-content-between">
            <!-- <div class="col-md-3 mt-4">
                <div class="bg-white myCard">
                    <div class="title d-flex align-items-center justify-content-center mb-4">
                        <img style="height: 40px;" src="../../../../assets/Imgs/bank-account-icon.svg" alt="cardCenter">
                        <h5 class="text-center ms-3 mb-0" style="padding-bottom: 3px;border-bottom: 2px solid #0f85d3;">
                            Card
                            Center Stock</h5>
                    </div>
                    <ng-container *ngFor="let product of cardCenterStock?.productsWithAmount">
                        <div class="product-card text-white mt-3 p-3 d-flex justify-content-between">
                            <span>{{product.productName}}</span>
                            <span>{{product.cardAmount}}</span>
                        </div>
                    </ng-container>
                </div>
            </div> -->
            <div class="col-md-6 myCard bg-white mt-4">
                <div class="d-flex justify-content-center">
                    <h4 class="m-0 me-3" style="border-bottom: 2px #0f85d3 solid;padding-bottom: 3px;">Target branch
                    </h4>
                </div>
                <form [formGroup]="form" (submit)="onTransferSubmit()">
                    <div class="d-flex ms-3 align-items-center mb-3">

                        <img src="../../../../assets/Imgs/bank-account-icon.svg" alt="" style="height: 45px;">
                        <select class="form-select w-75 mb-3 mt-3 ms-4" (change)="branchStockChange($event)"
                            formControlName="branchName">
                            <option selected disabled>Select Branch</option>
                            <option *ngFor="let branch of branches" [value]="branch.branchName">{{branch.branchName}}
                            </option>
                        </select>
                    </div>




                    <table class="table">
                        <thead class="text-center">
                            <tr>
                                <td>Product</td>
                                <td>Transfer Quantity</td>
                            </tr>
                        </thead>
                        <tbody formArrayName="productNamesWithCardAmount">
                            <tr class="text-center" *ngFor="let item of itemsArray.controls; let i = index"
                                [formGroupName]="i">
                                <td>
                                    {{products[i].productName}}
                                </td>
                                <td>
                                    <input type="number" min="1" class="form-control" formControlName="cardAmount">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="d-flex justify-content-center">
                        <button class="btn transferBtn">Transfer</button>
                    </div>
                </form>
            </div>

            <div *ngIf="!isEmpty && !isNotSelected" class="col-md-5 mt-4">
                <section class="selectedBranch myCard mt-4" *ngIf="selectedBranchStock">
                    <div class="title me-3 d-flex justify-content-center align-items-center mb-3">
                        <img src="../../../../assets/Imgs/bank-account-icon.svg" alt="" style="height: 45px;">
                        <span class="m-0 ms-3 me-3 orange-underline fav">{{selectedBranchStock.branchName}}</span>
                    </div>
                    <span class="product-quantity d-flex justify-content-between mt-2 p-3 fav"
                        *ngFor="let stock of selectedBranchStock?.productsWithAmount">
                        <span>
                            {{stock.productName}}
                        </span>
                        <span>
                            {{stock.cardAmount}}
                        </span>
                    </span>

                </section>
            </div>
            <div *ngIf="isEmpty" class="col-md-5 mt-4">
                <h5 class="text-center">No stock for this branch</h5>
                <img src="../../../../assets/Imgs/Empty-rafiki.png" alt="empty"  class="img-fluid" style="height: 80%;">
            </div>
            <div *ngIf="isNotSelected" class="col-md-5 mt-4">
                <h5 class="text-center">Select Branch</h5>
                <img src="../../../../assets/Imgs/Select-amico.png" alt="not selected" class="img-fluid" style="height: 80%;">
            </div>
        </div>
    </div>
</section>
