
<app-navbar></app-navbar>


<div class="table-header">
      <div class="search-container">
         <input type="text" placeholder="Search by name or branch" class="form-control"
       (keyup)="applyFilter($event)">
      </div>
      <div class="header-buttons">


       <a routerLink="/add-machine-config" class="add-button text-decoration-none">
    <i class="fa fa-plus"></i> Add Machine
</a>

      </div>
    </div>

<div class="d-flex justify-content-center align-items-center container">
    <div style="width: 100%;">
        <h2 style="color: #36454F;" class="text-center mt-3 mb-2">Machines </h2>
        <div class="justify-content-center d-flex mb-3">
    <div style="height: 1px;width: 100px;background-color: #2e688e;"></div>
</div>


          <div class="p-3 d-flex justify-content-center">
    <div class="card container-fluid p-0">
        <table matSort mat-table [dataSource]="dataSource " class="table-desponsive table-none-scroll">
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <ng-container matColumnDef="ip">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;">
                    IP
                </th>
                <td mat-cell *matCellDef="let element"> {{element.ip}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Name </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>


              <ng-container matColumnDef="model">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Model </th>
                <td mat-cell *matCellDef="let element"> {{element.model}} </td>
            </ng-container>


            <ng-container matColumnDef="port">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Port </th>
                <td mat-cell *matCellDef="let element"> {{element.port}} </td>
            </ng-container>

            <ng-container matColumnDef="feederId">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Feeder </th>
                <td mat-cell *matCellDef="let element"> {{element.feederId}} </td>
            </ng-container>

              <ng-container matColumnDef="branchName">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Branch </th>
                <td mat-cell *matCellDef="let element"> {{element.branchName}} </td>
            </ng-container>

            <ng-container matColumnDef="Actions" class="text-center">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Actions </th>
                <td mat-cell *matCellDef="let element" >
                    <ul class="d-flex justify-content-start px-0   align-items-center " style="list-style: none;">

                          <li class="me-2 ">
                          <a [routerLink]="['/machine-config-details',element.ip]" >
                                 <i class="fa-solid fa-eye text-primary"></i>
                              </a>
                          </li>
                          <li class="m-2">
                               <a [routerLink]="['/edit-machine-config',element.ip]" >
                                  <i class="fa-regular fa-pen-to-square text-success"></i>
                              </a>

                          </li>
                           <li class="m-2 " (click)="Delete(element .ip)"><i class="fa-solid fa-trash text-danger cursor-pointer"></i></li>
                        </ul>
                </td>
            </ng-container>




        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of user elements">
        </mat-paginator>
    </div>
          </div>

      </div>
</div>
