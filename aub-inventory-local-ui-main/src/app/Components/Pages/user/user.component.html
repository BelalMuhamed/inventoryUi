<app-navbar></app-navbar>

<h2 style="color: #36454F;" class="text-center mt-3">Users</h2>
<div class="justify-content-center d-flex mb-3">
    <div style="height: 1px;width: 100px;background-color: #2e688e;"></div>
</div>


<div class="search row ms-3 mt-4 m-0">
    <div class="col-md-4">

          <input
  type="text"
  placeholder="Search by User name"
  class="form-control"
  [(ngModel)]="searchTerm"
  name="search" />

    </div>
    <div class="col-md-6">
        <button mat-raised-button color="primary" class="ms-3" (click)="search()">
            <div class="d-flex justify-content-center align-items-center">

                <span>
                    Search
                </span>
            </div>
        </button>
    </div>
    <div class="col-md-2">
        <button mat-raised-button color="primary" class="ms-3"  (click)="openAddDialog()" [disabled]="isAppeared">
            <div class="d-flex justify-content-center align-items-center">

                <span>
                    Add User
                </span>
                <mat-spinner *ngIf="isAppeared" class="ms-2"  style="width: 20px;height: 20px;"></mat-spinner>
            </div>
        </button>
    </div>
</div>



<div class="p-3 d-flex justify-content-center">
    <div class="card container-fluid p-0">
        <table matSort mat-table [dataSource]="userList" class="table-desponsive table-none-scroll">
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color:black;">
                    Username
                </th>
                <td mat-cell *matCellDef="let element"> {{element.username}} </td>
            </ng-container>

            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color:black;"> Role </th>
                <td mat-cell *matCellDef="let element"> {{element.role}} </td>
            </ng-container>

            <!-- <ng-container matColumnDef="branchName">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Branch </th>
                <td mat-cell *matCellDef="let element"> {{element.branchName}} </td>
            </ng-container> -->


            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color:black;"> Action </th>
                <td mat-cell *matCellDef="let element">
                    <!-- <button mat-raised-button color="primary" (click)="openEditDialog(element.username,element.role,element.branchName)">Edit</button> -->
                    <button mat-raised-button color="primary" (click)="openEditDialog(element.username,element.role)">Edit</button>
                    <button class="ms-3" mat-raised-button color="warn"
                        (click)="deleteUser(element.username)">Delete</button>
                </td>
            </ng-container>




        </table>
       <mat-paginator
  [length]="UsersCount"
  [pageSize]="defaultParams.pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons
  (page)="onPageChange($event)">
</mat-paginator>

    </div>
</div>
