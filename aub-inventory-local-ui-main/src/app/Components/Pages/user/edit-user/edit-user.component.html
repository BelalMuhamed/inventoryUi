<mat-card style="width: 500px;">

                </div>

                        [(ngModel)]="data.branchName">
                        <option *ngFor="let name of branchNames" [value]="name">{{name}}</option>
                    </select>
                </div> -->
            </div>
        </mat-card-content>


    <mat-card-actions class="justify-content-end">
           <button mat-button color="warn" (click)="editUser()">Edit</button>
    </mat-card-actions>
</mat-card>
