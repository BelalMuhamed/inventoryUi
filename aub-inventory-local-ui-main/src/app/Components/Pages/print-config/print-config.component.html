<app-navbar></app-navbar>
<div class="container d-flex justify-content-between mt-5 px-4">
  <div class="w-auto">
 <label style="color: #0f85d3;"> Select Product</label>
                        <label style="color: red;">*</label>
                       <select class="form-select mb-3" (change)="onProductSelected($event)">
                      <option value="" disabled selected>Select product Name...</option>
                      <option *ngFor="let product of AllProducts" [value]="product.productName">
                        {{ product.productName }}
                      </option>
                    </select>

  </div>
      <div class="header-buttons">


       <a routerLink="/add-new-print-config" class="add-button text-decoration-none">
    <i class="fa fa-plus"></i> Add Print Configuration
</a>

      </div>
</div>
<div class="table-container container">

  <div *ngIf="isLoading" class="loading-overlay">
    <mat-spinner diameter="60"></mat-spinner>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" *ngIf="!isLoading">

    <ng-container *ngFor="let col of columns; trackBy: trackByKey" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef>{{ col.label }}</th>
      <td mat-cell *matCellDef="let element">

        <ng-container [ngSwitch]="col.type">

          <ng-container *ngSwitchCase="'image'">
            <img   [src]="'data:image/png;base64,' + element[col.key]" alt="Design Image" class="table-image" />
          </ng-container>

          <ng-container *ngSwitchCase="'date'">
            {{ element[col.key] | date: 'short' }}
          </ng-container>

          <ng-container *ngSwitchCase="'currency'">
            {{ element[col.key] | currency:'EGP':'symbol' }}
          </ng-container>
        <ng-container *ngSwitchCase="'printedFace'">
          {{ element[col.key] === 0 ? 'Front' : 'Back' }}
        </ng-container>

        <ng-container *ngSwitchCase="'printWay'">
          {{ element[col.key] === 0 ? 'Landscape' : 'Portrait' }}
        </ng-container>
          <ng-container *ngSwitchCase="'boolean'">
            <mat-icon *ngIf="element[col.key]" color="primary">check_circle</mat-icon>
            <mat-icon *ngIf="!element[col.key]" color="warn">cancel</mat-icon>
          </ng-container>

          <ng-container *ngSwitchCase="'actions'">
            <div class="actions-cell">
              <button mat-icon-button color="primary" (click)="editProductConfig(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </ng-container>

          <ng-container *ngSwitchDefault>
            {{ element[col.key] }}
          </ng-container>

        </ng-container>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumnKeys"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumnKeys"></tr>

  </table>

  <mat-paginator
    [length]="totalCount"
    [pageIndex]="req.pageIndex - 1"
    [pageSize]="req.pageSize"
    [pageSizeOptions]="[5, 10, 15,20]"
    (page)="onPageChange($event)">
  </mat-paginator>

</div>
