<div class="login-body">
    <div class="text-logo-bg img-fluid">
        <img src="../../../../assets/Imgs/logo-sm-w-big.png">
    </div>
    <div class="login-form">
        <div class="row login-box justify-content-center">
            <div class="col text-center left-box p-5">
                <img src="../../../../assets/Imgs/logo-sm.png" class="txt-logo col-md-3 img-fluid">
            </div>
            <form class="col" [formGroup]="loginForm">
                <div class=" align-items-center justify-content-center col d-block right-box p-5">
                    <img src="../../../../assets/Imgs/AUB-Logo.png" class="mb-5 img-fluid">
                    <label style="color: #0f85d3;">User Name</label>
                    <input class="form-control mb-3" type="text" formControlName="userName">
                    <label style="color: #0f85d3;"> Password</label>
                    <input class="form-control mb-3" type="password" formControlName="password">
                    <button [disabled]="!loginForm.valid" class="btn mt-3 px-5 login-btn">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>
