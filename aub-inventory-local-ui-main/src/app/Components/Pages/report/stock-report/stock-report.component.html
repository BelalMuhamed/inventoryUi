<div>
  <div class="d-flex mt-5 justify-content-around align-items-end">

    <div style="width: 100%;" class="me-5">
      <label class="mb-2" style="color: #0f85d3;">Search By Branch</label>
      <select class="form-select" [(ngModel)]="selectedBranch" [disabled]="!isCCAdmin">
        <option value="" selected disabled>Select Branch</option>
        <ng-container *ngIf="isCCAdmin">
          <option value="All">All</option>
          <option *ngFor="let branch of branches">{{branch.branchName}}</option>
        </ng-container>
        <ng-container *ngIf="!isCCAdmin">
          <option>{{selectedBranch}}</option>
        </ng-container>
      </select>
    </div>

    <div>
      <div class="d-flex justify-content-center mt-4">
        <button class="btn btn-dark" (click)="searchStocks()" [disabled]="!validSearch()">
          <div class="d-flex align-items-center">
            <img src="../..//../../../assets/Imgs/search2.png" class="me-1" width="20px" height="20px"
              style="color: white;">
            <span>Search</span>
          </div>
        </button>
      </div>
    </div>
  </div>
  <div class="text-end mt-5">
    <button class="btn btn-success" (click)="exportStockToExcel()">
      <div class="d-flex align-items-center ">
        <img src="../../../../../assets/Imgs/download.png" class="me-1" alt="" width="20px" height="20px">
        <span>Export To Excel</span>
      </div>
    </button>
  </div>

</div>


<table class="table mt-2">
  <thead>
    <tr class="text-center">
      <th>Branch Name</th>
      <ng-container>
        <th *ngIf="stocks[0]?.allProductsStock" [attr.colspan]="allProductsColspan">
          <p style="font-size: 12px; font-weight: 500; color: white;margin: 0px;">All Products Stock</p>
          <div class="d-flex align-items-center justify-content-around">
            <div *ngFor="let product of stocks[0]?.allProductsStock | keyvalue">
              <span>{{product.key}}</span>
            </div>
          </div>
        </th>
        <!-- <th>{{ product.key }} <p style="font-size: 12px; font-weight: 500; color: white;margin: 0px;">In Stock</p> </th> -->
      </ng-container>
      <ng-container>
        <!-- <th>{{ product.key }} <p style="font-size: 12px; font-weight: 500; color: white;margin: 0px;">Utillized</p> </th> -->
        <th *ngIf="stocks[0]?.utillizedProducts" [attr.colspan]="utillizedColspan">
          <p style="font-size: 12px; font-weight: 500; color: white;margin: 0px;">Utilized</p>
          <div class="d-flex align-items-center justify-content-around">
            <div *ngFor="let product of stocks[0]?.utillizedProducts | keyvalue">
              <span>{{product.key}}</span>
            </div>
          </div>
        </th>
      </ng-container>
      <ng-container>
        <th *ngIf="stocks[0]?.inStockProducts" [attr.colspan]="inStockColspan">
          <p style="font-size: 12px; font-weight: 500; color: white;margin: 0px;">In Stock</p>
          <div class="d-flex align-items-center justify-content-around">
            <div *ngFor="let product of stocks[0]?.inStockProducts | keyvalue">
              <span>{{product.key}}</span>
            </div>
          </div>
        </th>
        <!-- <th>{{ product.key }} <p style="font-size: 12px; font-weight: 500; color: white;margin: 0px;">In Stock</p> </th> -->
      </ng-container>


    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let branchStock of stocks" class="text-center">
      <td>{{ branchStock.branchName }}</td>
      <ng-container *ngFor="let product of branchStock.allProductsStock | keyvalue">
        <td>{{product.value}}</td>
      </ng-container>
      <ng-container *ngFor="let product of branchStock.utillizedProducts | keyvalue">
        <td>{{product.value}}</td>
      </ng-container>
      <ng-container *ngFor="let product of branchStock.inStockProducts | keyvalue">
        <td style="margin: 3px;" [ngStyle]="getProductStyle(product.value,product.key)">{{product.value}}</td>
      </ng-container>

    </tr>
  </tbody>
</table>
<mat-paginator #stockPaginator [length]="totalStocks" [pageSize]="pageSize" [pageIndex]="pageIndex"
(page)="pageEvent = PaginatorEvent($event)" aria-label="Select page">
</mat-paginator>
