<app-navbar></app-navbar>
<div class="container d-flex flex-column justify-content-center align-items-center my-5">
  <div class="w-50">
 <label style="color: #0f85d3;"> Select Branch</label>
                        <label style="color: red;">*</label>
                       <select class="form-select mb-3" (change)="onBranchSelect($event)">
                      <option value="" disabled selected>Select Branch Name...</option>
                      <option *ngFor="let branch of AllBranches" [value]="branch.branchName">
                        {{ branch.branchName }}
                      </option>
                    </select>

  </div>
  <div *ngIf="IsBranchSelected">
     <div class="table-header">
      <div class="search-container">

         <input type="text" placeholder="Search by User name or machine name " class="form-control"
       (keyup)="applyFilter($event)">
      </div>
      <div class="header-buttons">



      </div>
    </div>
    <div class="d-flex justify-content-center align-items-center container">
    <div style="width: 100%;">
        <h2 style="color: #36454F;" class="text-center mt-3 mb-2">Users </h2>
        <div class="justify-content-center d-flex mb-3">
    <div style="height: 1px;width: 100px;background-color: #2e688e;"></div>
</div>


          <div class="p-3 d-flex justify-content-center">
    <div class="card container-fluid p-0">
        <table matSort mat-table [dataSource]="dataSource " class="table-desponsive table-none-scroll">


                            <ng-container matColumnDef="username" style="font-weight: bold;background-color: #f2f2f2;">
              <th mat-header-cell *matHeaderCellDef>User Name</th>
              <td mat-cell *matCellDef="let element">
                <mat-form-field appearance="outline">
                  <input matInput [value]="element" readonly />
                </mat-form-field>
              </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold;background-color: #f2f2f2;"> Actions </th>
                <td mat-cell *matCellDef="let element">
                 <ul class="d-flex justify-content-center   align-items-center " style="list-style: none;">


                          <li class="m-2">

                               <a (click)="openPopup(element)"class="add-button text-decoration-none" >


                                   <i class="fa fa-plus  fs-1"></i>
                              </a>

                          </li>

                  </ul>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of user elements">
        </mat-paginator>
    </div>
          </div>

      </div>
    </div>

  </div>
</div>
