<app-navbar></app-navbar>
<div>
    <h2 style="color: #36454F;" class="text-center mt-3 mb-2">Import Event File</h2>
    <div class="justify-content-center d-flex mb-4">
        <div style="height: 1px;width: 60px;background-color: #0f85d3;"></div>
    </div>
</div>
<div class="d-flex justify-content-center">
    <div class="hero-container col-md-6 mt-4">
        <div class="d-flex justify-content-center align-items-center mb-4">
            <img src="../../../../assets/Imgs/uploadArrow.png" alt="upload" style="height: 30px;">
            <h2 class="text-center ms-3 me-3">Upload File</h2>
            <img src="../../../../assets/Imgs/uploadArrow.png" alt="upload" style="height: 30px;">
        </div>
        <div class="d-flex">
            <label for="input-file" id="drop-area">
                <input type="file" id="input-file"  (change)="onFileSelected($event)" accept=".kat" hidden >
                <div id="icon-view">
                    <img src="../../../../assets/Imgs/Icons/upload.png" alt="upload" class="img-fluid">
                    <p class="mt-3 mb-1 text-secondary">Drag and drop encrypted file or click here.</p>
                    <span class="text-secondary">supported file type: <b>kat</b></span>
                </div>
            </label>
        </div>
    </div>
</div>
